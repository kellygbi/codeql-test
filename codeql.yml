name: "CodeQL Advanced Security Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '30 18 * * 1' # Runs automatically every Monday at 18:30 UTC

jobs:
  analyze:
    name: Analyze Code
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # Supported languages: c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift
        # Specify the language(s) you want to test here:
        language: [ 'javascript-typescript', 'python' ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Initializes the CodeQL tools for scanning
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    # Autobuild attempts to build compiled languages (like Java, C#, Go)
    - name: Autobuild Code
      uses: github/codeql-action/autobuild@v3

    # Performs the actual static analysis scan
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{ matrix.language }}"
